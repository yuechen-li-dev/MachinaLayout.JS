<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Machina Static Accordion</title>
    <link rel="stylesheet" href="generated.css" />
  </head>
  <body>
<section class="machina-accordion" id="faq">
    <div class="machina-accordion__item">
      <input class="machina-accordion__input" type="checkbox" id="faq-what-is-machina" checked />
      <label class="machina-accordion__label" for="faq-what-is-machina">What is Machina?</label>
      <div class="machina-accordion__panel">Machina lowers typed UI intent into browser artifacts.</div>
    </div>
    <div class="machina-accordion__item">
      <input class="machina-accordion__input" type="checkbox" id="faq-does-it-use-js" />
      <label class="machina-accordion__label" for="faq-does-it-use-js">Does this use JavaScript?</label>
      <div class="machina-accordion__panel">No. This accordion is powered by checkbox state and CSS selectors.</div>
    </div>
    <div class="machina-accordion__item">
      <input class="machina-accordion__input" type="checkbox" id="faq-is-this-cursed" />
      <label class="machina-accordion__label" for="faq-is-this-cursed">Is this cursed?</label>
      <div class="machina-accordion__panel">Yes, but intentionally.</div>
    </div>
  </section>
  </body>
</html>
